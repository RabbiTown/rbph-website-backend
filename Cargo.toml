[package]
name = "rbph-website-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-session = { version = "0.11.0", features = ["redis-session"] }
actix-web = { version = "4" }
actix-web-actors = "4.3.1"
askama = "0.15.1"
base64 = "0.22.1"
bcrypt = "0.17.1"
chrono = "0.4.42"
config = "0.15.18"
dashmap = "6.1.0"
deadpool = "0.12.3"
deadpool-redis = "0.22.0"
derive_more = "2.0.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
futures-util = "0.3.31"
lettre = { version = "0.11.19", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
] }
log = "0.4.28"
num_enum = "0.7.5"
once_cell = "1.21.3"
rand = "0.9.3"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "time",
    "json",
] }
time = { version = "0.3.47", features = ["serde"] }
tokio = "1.48.0"
uuid = { version = "1.18.1", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
