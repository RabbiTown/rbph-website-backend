[package]
name = "rbph-website-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-files = "0.6.10"
actix-multipart = "0.7.2"
actix-session = { version = "0.11.0", features = ["redis-session"] }
actix-web = { version = "4.13.0" }
actix-ws = "0.4.0"
askama = "0.15.1"
base64 = "0.22.1"
bcrypt = "0.17.1"
chrono = "0.4.45"
config = "0.15.23"
dashmap = "6.1.0"
deadpool = "0.12.3"
deadpool-redis = { version = "0.22.0", features = ["script"] }
derive_more = "2.0.1"
dotenvy = "0.15.7"
env_logger = "0.11.10"
futures-util = "0.3.32"
hmac = "0.12.1"
lettre = { version = "0.11.22", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
] }
log = "0.4.32"
md-5 = "0.10.6"
num_enum = "0.7.6"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
rand = "0.9.3"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
sqlx = { version = "0.8.6", features = [
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "time",
    "json",
] }
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.48.0", features = ["macros"] }
uuid = { version = "1.18.1", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
zip = "8.6.0"
boa_engine = "0.21.1"
futures = "0.3.32"
