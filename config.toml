[app]
deployment_mode = "single"
deployment_id = "local"
production = false
bind_addr = ["127.0.0.1", 9999]
kv_addr = "redis://localhost/1"
secret_key = "cmJwaC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LTAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA=="

[db]
addr = "postgres://postgres:123456@localhost/rbph"
password = ""
max_connections = 32

[storage]
default_backend = "local"
# content_cdn_backend = "cos"

[storage.backends.local]
kind = "local"
label = "Local"
asset_root = "./assets"

[storage.backends.private]
kind = "database"
label = "Data"

[auth]

[auth.rate_limit]
enabled = true
login_ip_email_failures = 5
login_ip_attempts = 30
login_window_seconds = 900
registration_email_attempts = 3
registration_ip_attempts = 10
registration_window_seconds = 3600

[auth.captcha]
provider = "disabled"

[auth.email]
enabled = false
sender = "RBPH <bot@rabbi.town>"
smtp = ""
smtp_user = ""
smtp_pass = ""

[auth.email.url]
verify = "http://localhost/verify?token={}"
